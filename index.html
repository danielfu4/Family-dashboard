<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>記帳 Wallet</title>
<style>
  :root{
    --bg: #f1f0f0;
    --card: #ffffff;
    --ink: #16161a;
    --ink-soft: #8b8b90;
    --ink-faint: #c2c1c0;
    --accent-lime: #d6ff3f;
    --accent-red: #ff6151;
    --accent-red-soft: #ffe1dc;
    --accent-blue: #3d8bff;
    --radius-xl: 32px;
    --radius-lg: 26px;
    --radius-md: 18px;
    --radius-pill: 999px;
    --font-latin: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    --font-han: "PingFang TC", "Noto Sans TC", var(--font-latin);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  html::-webkit-scrollbar, body::-webkit-scrollbar{ width:0; display:none; }
  html,body{ scrollbar-width:none; -ms-overflow-style:none; }
  body{
    background: #dedcd8;
    font-family: var(--font-han);
    color: var(--ink);
    display:flex;
    justify-content:center;
    min-height:100vh;
  }

  .phone{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background: #ffffff;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Date strip ---------- */
  .date-strip-wrap{
    padding: 22px 0 6px;
    position:relative;
  }
  .date-strip{
    display:flex;
    align-items:flex-start;
    gap: 10px;
    overflow-x:auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding: 6px 50% 0;
    scrollbar-width:none;
    min-height: 132px;
  }
  .date-strip::-webkit-scrollbar{ display:none; }
  .date-item{
    scroll-snap-align:center;
    flex: 0 0 66px;
    width:66px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    font-family: var(--font-latin);
    user-select:none;
    line-height:1;
    will-change: transform, opacity;
  }
  .date-item .wd{
    font-size:13px; font-weight:400; color: var(--ink-faint); line-height:1;
    transition: color .18s ease, font-weight .18s ease;
  }
  .date-item .dn{
    font-size:22px; font-weight:400; color: var(--ink-faint); line-height:1;
    margin-top:3px; letter-spacing:-.5px;
    transform-origin: 50% 0%;
    will-change: transform;
    transition: color .18s ease, font-weight .18s ease;
  }
  .date-item.is-center .wd{ font-weight:500; color: var(--ink-soft); }
  .date-item.is-center .dn{ font-weight:600; color: var(--ink); }

  .day-summary{
    position:relative;
    margin: 6px 22px 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background: transparent;
    padding: 2px 2px;
  }
  .day-summary .ds-left{
    display:flex; align-items:baseline; gap:8px;
    color: var(--ink-soft); font-size:13px;
  }
  #daySummaryLabel{
    display:inline-block; min-width:58px;
    transition: opacity .16s ease;
  }
  .ds-left.is-swapping #daySummaryLabel,
  .ds-left.is-swapping b,
  .ds-right.is-swapping .ds-amount{ opacity:0; }
  .day-summary .ds-left b,
  .day-summary .ds-amount{ transition: opacity .16s ease; }
  .day-summary .ds-left b{ color:var(--ink); font-size:13px; font-weight:600; }
  .day-summary .ds-amount{ font-size:13px; color:var(--ink-soft); }
  .day-summary .ds-right{
    display:flex; align-items:center; justify-content:flex-end;
  }
  /* The amount slides sideways rather than being pushed, so the motion is intentional */
  #daySummaryAmount{
    transform: translateX(0);
    /* returning to the right waits for the button to fade out first */
    transition: opacity .16s ease, transform .3s cubic-bezier(.22,.9,.35,1) .16s;
  }
  #daySummaryAmount.is-shifted{
    transform: translateX(calc(-1 * var(--btn-shift, 96px)));
    /* moving left happens immediately */
    transition: opacity .16s ease, transform .3s cubic-bezier(.22,.9,.35,1) 0s;
  }
  #backToTodayBtn{
    /* absolutely placed so it never affects the amount's layout position */
    position:absolute;
    right:0; top:50%;
    transform: translateY(-50%);
    border:none; background: var(--ink); color:#fff; font-family:var(--font-han);
    font-size:12px; padding:6px 12px; border-radius: var(--radius-pill);
    white-space:nowrap;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    /* leaving: fade out straight away */
    transition: opacity .18s ease 0s, visibility .18s;
  }
  #backToTodayBtn.is-visible{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    /* arriving: wait for the amount to finish sliding */
    transition: opacity .22s ease .26s, visibility .22s .26s;
  }

  /* ---------- Top panel ---------- */
  .top-panel{ padding: 62px 26px 6px; }
  .greeting-text{
    margin:0 0 14px;
    font-family: var(--font-latin);
    font-size: 30px;
    line-height: 1.09;
    color: var(--ink-soft);
    font-weight:300;
  }
  .greeting-text b{ color: var(--ink); font-weight:600; }

  .asset-row{ display:flex; align-items:center; justify-content:space-between; gap: 14px; }
  .asset-amount{
    display:flex; align-items:baseline; gap:4px; cursor:pointer;
    font-family: var(--font-latin);
    font-weight:500;
  }
  .asset-amount .currency{ font-size: 48px; font-weight:500; letter-spacing:-1px; }
  .asset-amount #assetValue{ font-size: 48px; font-weight:500; letter-spacing:-1px; }
  .badge{
    font-family: var(--font-han);
    font-size:14px; font-weight:600;
    background: var(--accent-lime);
    color:#1c2400;
    padding:5px 10px;
    border-radius: var(--radius-pill);
    align-self:center;
  }
  .badge.neg{ background:#ffd8d2; color:#7a1200; }

  .add-btn{
    flex:0 0 auto;
    width:52px; height:52px;
    border-radius: 16px;
    background: var(--ink);
    color:#fff;
    border:none;
    font-size:26px;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 18px rgba(0,0,0,.18);
  }
  .add-btn:active{ transform: scale(.94); }

  .unit-label{
    margin-top:6px;
    font-size:12px;
    color: var(--ink-soft);
    font-family: var(--font-latin);
    letter-spacing:.3px;
  }

  /* ---------- Season art ---------- */
  .season-art{
    margin-top: 10px;
    width:100%;
    aspect-ratio: 2634 / 1600;
    background-color: #ffffff;
    background-size: 100% auto;
    background-repeat: no-repeat;
    background-position: center bottom;
    position:relative;
    flex-shrink:0;
  }
  .season-art::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(to bottom, rgba(255,255,255,0) 78%, #ffffff 100%);
  }
  .season-tag{
    display:none;
  }

  /* ---------- Bottom sheet ---------- */
  .sheet{
    position:absolute;
    left:0; right:0;
    background: rgba(241, 240, 240, 0.72);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-top: 1px solid rgba(255,255,255,.6);
    border-radius: 26px 26px 0 0;
    display:flex;
    flex-direction:column;
    z-index:3;
    touch-action: pan-y;
    box-shadow: 0 -6px 24px rgba(0,0,0,.06);
    will-change: transform;
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
    .sheet{ background: var(--bg); }
  }
  .sheet-handle{
    position:absolute;
    top:0; left:0; right:0;
    display:flex; justify-content:center; align-items:center;
    padding: 16px 0 10px;
    cursor:grab;
    touch-action:none;
    z-index:5;
  }
  .sheet-handle span{
    width:36px; height:5px; border-radius:3px; background: var(--ink-faint);
    display:block;
  }
  .sheet-content{
    /* top padding clears the floating handle; content scrolls up beneath it */
    padding: 44px 22px 60px;
    overflow-y:auto;
    -webkit-overflow-scrolling: touch;
    flex:1;
    /* Fade region starts at the very top of the panel, i.e. across the handle */
    -webkit-mask-image: linear-gradient(to bottom,
        rgba(0,0,0,0) 0px,
        rgba(0,0,0,.15) 24px,
        rgba(0,0,0,.55) 48px,
        rgba(0,0,0,1) 80px);
    mask-image: linear-gradient(to bottom,
        rgba(0,0,0,0) 0px,
        rgba(0,0,0,.15) 24px,
        rgba(0,0,0,.55) 48px,
        rgba(0,0,0,1) 80px);
  }

  .sheet-content::-webkit-scrollbar{ width:0; height:0; display:none; }
  .sheet-content{ scrollbar-width: none; -ms-overflow-style: none; }

  /* Custom scroll indicator — only visible while the panel is being scrolled */
  .scroll-indicator{
    position:absolute;
    right:5px;
    width:3px;
    border-radius:3px;
    background: rgba(0,0,0,.22);
    opacity:0;
    pointer-events:none;
    transition: opacity .3s ease;
    z-index:4;
  }
  .scroll-indicator.is-active{ opacity:1; transition: opacity .12s ease; }

  .goal-card{
    background: rgba(255,255,255,.82);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: var(--radius-xl);
    padding: 22px 24px 24px;
    margin-bottom: 14px;
  }
  .goal-head{ display:flex; justify-content:space-between; align-items:flex-start; }
  .goal-head h2{ margin:0; font-size:19px; font-weight:700; }
  .goal-head p{ margin:4px 0 0; font-size:12.5px; color: var(--ink-soft); }
  .pill-btn{
    border:1px solid var(--ink-faint);
    background:transparent;
    color: var(--ink);
    font-family: var(--font-han);
    font-size:12.5px;
    font-weight:600;
    padding:7px 14px;
    border-radius: var(--radius-pill);
    white-space:nowrap;
  }
  .pill-btn:active{ background: var(--bg); }

  .goal-numbers{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-top:18px; font-family: var(--font-latin);
  }
  .goal-numbers #goalCurrent{ font-size:26px; font-weight:700; }
  .goal-numbers #goalPercent{ font-size:22px; font-weight:600; color: var(--ink-soft); }

  .progress-track{
    position:relative;
    margin-top:10px;
    height:10px;
    border-radius: var(--radius-pill);
    background: #eeece8;
    overflow:visible;
  }
  .progress-fill{
    height:100%;
    border-radius: var(--radius-pill);
    background: linear-gradient(90deg,#3d8bff, #8fe36a);
    width:0%;
    transition: width .5s ease;
  }
  .progress-marker{
    position:absolute; top:-4px;
    width:2px; height:18px; background: var(--ink);
    opacity:.35; left:0%;
  }
  .progress-marker::after{
    content:"";
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    border-left:4px solid transparent; border-right:4px solid transparent;
    border-top:5px solid var(--ink); opacity:.6;
  }

  .goal-edit{ margin-top:16px; display:none; flex-direction:column; gap:10px; }
  .goal-edit.open{ display:flex; }
  .goal-edit input{
    border:1px solid var(--ink-faint); border-radius: var(--radius-md);
    padding:10px 14px; font-family: var(--font-han); font-size:14px; background:var(--bg);
  }
  .goal-edit-actions{ display:flex; gap:8px; justify-content:flex-end; }
  .goal-edit-actions button{
    border:none; border-radius: var(--radius-pill); padding:8px 16px;
    font-family: var(--font-han); font-size:13px; font-weight:600;
  }
  .goal-save{ background: var(--ink); color:#fff; }
  .goal-cancel{ background: transparent; color: var(--ink-soft); }

  .card-list{ display:flex; flex-direction:column; gap:12px; }
  .info-card{
    position:relative;
    display:flex; align-items:center; flex-wrap:wrap;
    gap: 6px 10px;
    width:100%;
    text-align:left;
    background: rgba(255,255,255,.82);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border:none;
    border-radius: var(--radius-lg);
    padding: 20px 22px;
    font-family: var(--font-han);
    color: var(--ink);
  }
  .info-card-top{ display:flex; align-items:center; gap:10px; flex:1 1 auto; }
  .info-card-title{ font-size:16px; font-weight:700; }
  .info-card-sub{ font-size:12.5px; color: var(--ink-soft); font-family: var(--font-latin); }
  .info-card-value{
    font-family: var(--font-latin); font-size:20px; font-weight:600;
    margin-left:auto; margin-right:26px;
  }
  .info-card-value.gain{ color:#1a9e4b; }
  .info-card-value.loss{ color: var(--accent-red); }
  .chip{
    font-size:12px; font-weight:600; padding:5px 10px; border-radius: var(--radius-pill);
    background:#e6e5e5; color: var(--ink-soft);
  }
  .chip-used{ background: var(--accent-red); color:#ffffff; }
  .chevron{
    position:absolute; top:18px; right:18px;
    font-size:16px; color: var(--ink-soft);
  }

  /* ---------- Overlays ---------- */
  .overlay{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .overlay[hidden]{ display:none; }
  .backdrop{
    position:absolute; inset:0;
    background: rgba(241,239,236,.55);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  .add-sheet{
    position:relative; z-index:2;
    width:100%; max-width:430px;
    padding: 0 18px 34px;
    animation: rise .22s ease;
  }
  @keyframes rise{ from{ transform: translateY(24px); opacity:0; } to{ transform:none; opacity:1; } }

  .add-row{
    display:flex; align-items:center; gap:10px;
    background: var(--card);
    border-radius: var(--radius-pill);
    padding:8px;
    box-shadow: 0 14px 30px rgba(0,0,0,.16);
  }
  .category-select{
    flex:0 0 auto;
    background: var(--ink); color:#fff; border:none;
    border-radius: var(--radius-pill);
    padding:14px 18px;
    font-family: var(--font-han); font-size:15px; font-weight:600;
    display:flex; align-items:center; gap:6px;
    max-width:130px;
  }
  .category-select .caret{ font-size:12px; opacity:.8; }
  #amountInput{
    flex:1; border:none; background: var(--bg);
    border-radius: var(--radius-pill);
    padding:14px 16px;
    font-family: var(--font-latin); font-size:16px; color: var(--ink);
    min-width:0;
  }
  #amountInput::placeholder{ color: var(--ink-faint); }
  .confirm-btn{
    flex:0 0 auto; width:48px; height:48px; border-radius:50%;
    background: var(--ink); color:#fff; border:none; font-size:22px;
  }
  .confirm-btn:disabled{ opacity:.35; }

  .category-menu{
    margin-top:10px;
    background: var(--card);
    border-radius: var(--radius-lg);
    padding:8px;
    box-shadow: 0 14px 30px rgba(0,0,0,.16);
    display:flex; flex-wrap:wrap; gap:8px;
  }
  .category-menu button{
    border:1px solid var(--ink-faint); background:transparent;
    border-radius: var(--radius-pill); padding:9px 14px;
    font-family: var(--font-han); font-size:13.5px; color: var(--ink);
  }
  .category-menu button.active{ background: var(--ink); color:#fff; border-color: var(--ink); }

  .detail-sheet{
    position:relative; z-index:2;
    width:100%; max-width:430px;
    max-height:82vh;
    background: var(--card);
    border-radius: 28px 28px 0 0;
    padding: 20px 22px 30px;
    overflow-y:auto;
    animation: rise .22s ease;
  }
  .detail-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .detail-head h3{ margin:0; font-size:19px; font-weight:700; }
  .detail-close{
    border:none; background: var(--bg); width:32px; height:32px; border-radius:50%;
    font-size:16px; color: var(--ink-soft);
  }
  .detail-sub{ font-size:13px; color: var(--ink-soft); margin: 0 0 16px; font-family: var(--font-latin); }

  .tx-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 0; border-bottom:1px solid #eee;
  }
  .tx-row:last-child{ border-bottom:none; }
  .tx-left{ display:flex; flex-direction:column; }
  .tx-cat{ font-size:15px; font-weight:600; }
  .tx-date{ font-size:12px; color: var(--ink-soft); font-family: var(--font-latin); }
  .tx-amt{ font-family: var(--font-latin); font-size:16px; font-weight:600; }

  .empty-state{
    text-align:center; color: var(--ink-soft); font-size:13.5px;
    padding: 30px 10px;
  }

  .field-row{ display:flex; align-items:center; justify-content:space-between; margin:14px 0; }
  .field-row label{ font-size:14px; color: var(--ink-soft); }
  .field-row input{
    width:130px; text-align:right; border:1px solid var(--ink-faint);
    border-radius: var(--radius-md); padding:9px 12px; font-family: var(--font-latin);
    font-size:15px; background: var(--bg); color: var(--ink);
  }
  .save-row{ display:flex; justify-content:flex-end; margin-top:10px; }
  .save-row button{
    border:none; background: var(--ink); color:#fff; border-radius: var(--radius-pill);
    padding:10px 20px; font-family: var(--font-han); font-size:14px; font-weight:600;
  }

  .sparkline-wrap{ margin: 6px 0 14px; }
</style>
</head>
<body>
<div class="phone">

  <div class="date-strip-wrap">
    <div class="date-strip" id="dateStrip"></div>
  </div>

  <div class="day-summary">
    <div class="ds-left">
      <span id="daySummaryLabel">今天</span>
      <b id="daySummaryCount">0 筆</b>
    </div>
    <div class="ds-right">
      <span class="ds-amount" id="daySummaryAmount">$0</span>
      <button id="backToTodayBtn">回到今天</button>
    </div>
  </div>

  <section class="top-panel">
    <p class="greeting-text" id="greetingText"><b>Hi Daniel !</b> Welcome<br />to your wallet</p>
    <div class="asset-row">
      <div class="asset-amount" id="assetAmount" title="點擊編輯淨資產">
        <span class="currency">$</span><span id="assetValue">350,000</span>
        <span class="badge" id="assetChangeBadge" style="margin-left:6px;">+3.2%</span>
      </div>
      <button class="add-btn" id="openAddBtn" aria-label="新增花費">+</button>
    </div>
    <div class="unit-label">TWD ・ 淨資產</div>
  </section>

  <div class="season-art" id="seasonArt">
    <span class="season-tag" id="seasonTag" hidden></span>
  </div>

  <section class="sheet" id="sheet">
    <div class="sheet-handle" id="sheetHandle"><span></span></div>
    <div class="scroll-indicator" id="scrollIndicator"></div>
    <div class="sheet-content" id="sheetContent">

      <div class="goal-card">
        <div class="goal-head">
          <div>
            <h2 id="goalTitle">9 月目標</h2>
            <p id="goalSub">距離月底還有 27 天</p>
          </div>
          <button class="pill-btn" id="editGoalBtn">設定任務</button>
        </div>
        <div class="goal-numbers">
          <span id="goalCurrent">$0</span>
          <span id="goalPercent">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="goalFill"></div>
          <div class="progress-marker" id="goalMarker"></div>
        </div>

        <div class="goal-edit" id="goalEdit">
          <input type="text" id="goalNameInput" placeholder="目標名稱，例如：小豬撲滿計畫" />
          <input type="number" id="goalTargetInput" placeholder="目標金額" />
          <input type="number" id="goalCurrentInput" placeholder="目前進度金額" />
          <div class="goal-edit-actions">
            <button class="goal-cancel" id="goalCancelBtn">取消</button>
            <button class="goal-save" id="goalSaveBtn">儲存</button>
          </div>
        </div>
      </div>

      <div class="card-list">
        <button class="info-card" id="cardBudget">
          <div class="info-card-top">
            <span class="info-card-title">本月預算</span>
            <span class="chip" id="budgetChip">尚未設定</span>
          </div>
          <span class="chevron">↗</span>
        </button>

        <button class="info-card" id="cardSpend">
          <div class="info-card-top">
            <span class="info-card-title">本月花費</span>
            <span class="info-card-sub" id="spendMonthLabel">Sep</span>
          </div>
          <span class="info-card-value" id="spendValue">$0</span>
          <span class="chevron">↗</span>
        </button>

        <button class="info-card" id="cardFixed">
          <span class="info-card-title">固定花費</span>
          <span class="info-card-value" id="fixedValue">0%</span>
          <span class="chevron">↗</span>
        </button>

        <button class="info-card" id="cardInvest">
          <div class="info-card-top">
            <span class="info-card-title">投資走勢</span>
            <span class="info-card-sub">0050</span>
          </div>
          <span class="info-card-value gain" id="investValue">+$0</span>
          <span class="chevron">↗</span>
        </button>
      </div>
    </div>
  </section>

  <!-- Add expense overlay -->
  <div class="overlay" id="addOverlay" hidden>
    <div class="backdrop" data-close="add"></div>
    <div class="add-sheet">
      <div class="add-row">
        <button class="category-select" id="categoryBtn">一般花費 <span class="caret">⌄</span></button>
        <input type="number" inputmode="decimal" id="amountInput" placeholder="金額" />

  var seasonMap = [
    { key:"winter", label:"WINTER", months:[11,0,1] },
    { key:"spring", label:"SPRING", months:[2,3,4] },
    { key:"summer", label:"SUMMER", months:[5,6,7,8,9,10] }
  ];
  function applySeason(){
    var m = new Date().getMonth();
    var season = seasonMap.find(function(s){ return s.months.indexOf(m) !== -1; });
    var art = document.getElementById("seasonArt");
    art.style.backgroundImage = "url('" + SEASON_IMG[season.key] + "')";
    document.getElementById("seasonTag").textContent = season.label;
  }

  /* ---------------- Date strip ---------------- */
  var dateStrip = document.getElementById("dateStrip");
  var DAYS_BACK = 90;
  var DAYS_FORWARD = 30;
  var dateEls = [];

  function buildDateStrip(){
    var frag = document.createDocumentFragment();
    var today = new Date();
    for (var i = DAYS_BACK; i >= -DAYS_FORWARD; i--){
      var d = new Date(today);
      d.setDate(d.getDate() - i);
      var key = ymd(d);
      var el = document.createElement("div");
      el.className = "date-item" + (key === todayKey ? " is-today" : "");
      el.dataset.key = key;
      var wd = document.createElement("span");
      wd.className = "wd";
      wd.textContent = d.toLocaleDateString("en-US", { weekday: "short" });
      var dn = document.createElement("span");
      dn.className = "dn";
      dn.textContent = pad(d.getDate());
      el.appendChild(wd);
      el.appendChild(dn);
      el.addEventListener("click", function(){
        scrollToKey(this.dataset.key, true);
      });
      dateStrip.appendChild(el);
      dateEls.push(el);
    }
  }

  function scrollToKey(key, smooth){
    var el = dateStrip.querySelector('[data-key="' + key + '"]');
    if (!el) return;
    var target = el.offsetLeft + el.offsetWidth/2 - dateStrip.clientWidth/2;
    dateStrip.scrollTo({ left: target, behavior: smooth ? "smooth" : "auto" });
  }

  var scrollRaf = null;
  dateStrip.addEventListener("scroll", function(){
    if (scrollRaf) cancelAnimationFrame(scrollRaf);
    scrollRaf = requestAnimationFrame(updateCenterDate);
  });

  var settleTimer = null;
  dateStrip.addEventListener("scroll", function(){
    clearTimeout(settleTimer);
    settleTimer = setTimeout(function(){
      var key = findCenterKey();
      if (key) selectDate(key);
    }, 90);
  });

  function findCenterKey(){
    var center = dateStrip.scrollLeft + dateStrip.clientWidth/2;
    var best = null, bestDist = Infinity;
    dateEls.forEach(function(el){
      var mid = el._mid !== undefined ? el._mid : (el.offsetLeft + el.offsetWidth/2);
      var dist = Math.abs(mid - center);
      if (dist < bestDist){ bestDist = dist; best = el; }
    });
    return best ? best.dataset.key : null;
  }

  /* Cache each item's horizontal midpoint once — widths are fixed,
     so these never change until the viewport resizes. */
  function measureDateItems(){
    dateEls.forEach(function(el){
      el._mid = el.offsetLeft + el.offsetWidth/2;
      el._dn = el._dn || el.querySelector(".dn");
    });
  }

  var ARC_DEPTH = 45;   // how deep the valley dips at the centre (px)
  var MAX_SCALE = 2.0;  // centre number grows from 22px to ~44px
  var SCALE_WINDOW = 0.42;

  function layoutArc(){
    var half = dateStrip.clientWidth/2;
    if (!half) return;
    var centerX = dateStrip.scrollLeft + half;
    dateEls.forEach(function(el){
      var mid = el._mid;
      if (mid === undefined) return;
      var t = (mid - centerX) / half;
      var a = Math.min(1, Math.abs(t));
      // Parabolic valley: lowest at the centre, rising toward both edges
      var y = ARC_DEPTH * (1 - a * a);
      el.style.transform = "translateY(" + y.toFixed(2) + "px)";
      // Smooth size falloff, so only the item near the centre is enlarged
      var w = Math.max(0, 1 - a / SCALE_WINDOW);
      var s = 1 + (MAX_SCALE - 1) * w * w;
      el._dn.style.transform = "scale(" + s.toFixed(3) + ")";
      el.style.opacity = Math.max(0.18, 1 - a * 0.85).toFixed(2);
    });
  }

  function updateCenterDate(){
    layoutArc();
    var key = findCenterKey();
    dateEls.forEach(function(el){
      el.classList.toggle("is-center", el.dataset.key === key);
    });
  }

  function selectDate(key){
    state.selectedDate = key;
    renderDaySummary();
  }

  /* ---------------- Day summary ---------------- */
  var daySummarySwapTimer = null;
  var daySummaryPainted = false;

  /* The slide distance equals the button's real width plus a gap,
     so the amount lands exactly where the button begins. */
  function measureBackBtn(){
    var btn = document.getElementById("backToTodayBtn");
    var w = btn.offsetWidth;
    if (w > 0){
      document.getElementById("daySummaryAmount")
        .style.setProperty("--btn-shift", (w + 10) + "px");
    }
  }

  function renderDaySummary(){
    if (!daySummaryPainted){
      daySummaryPainted = true;
      writeDaySummary();
      return;
    }
    var leftGroup = document.querySelector(".day-summary .ds-left");
    var rightGroup = document.querySelector(".day-summary .ds-right");

    // Fade the old values out, swap the text while invisible, then fade back in —
    // so the reader never sees the characters change mid-flight.
    leftGroup.classList.add("is-swapping");
    rightGroup.classList.add("is-swapping");

    clearTimeout(daySummarySwapTimer);
    daySummarySwapTimer = setTimeout(function(){
      writeDaySummary();
      leftGroup.classList.remove("is-swapping");
      rightGroup.classList.remove("is-swapping");
    }, 160);
  }

  function writeDaySummary(){
    var isToday = state.selectedDate === todayKey;
    var label = document.getElementById("daySummaryLabel");
    var backBtn = document.getElementById("backToTodayBtn");
    var amountEl = document.getElementById("daySummaryAmount");
    if (isToday){
      label.textContent = "今天";
      backBtn.classList.remove("is-visible");
      amountEl.classList.remove("is-shifted");
    } else {
      var d = parseKey(state.selectedDate);
      label.textContent = (d.getMonth()+1) + "月" + d.getDate() + "日";
      measureBackBtn();
      amountEl.classList.add("is-shifted");
      backBtn.classList.add("is-visible");
    }
    var txs = state.transactions.filter(function(t){ return t.date === state.selectedDate; });
    var total = txs.reduce(function(s,t){ return s + t.amount; }, 0);
    document.getElementById("daySummaryCount").textContent = txs.length + " 筆";
    document.getElementById("daySummaryAmount").textContent = money(total);
  }

  document.getElementById("backToTodayBtn").addEventListener("click", function(){
    scrollToKey(todayKey, true);
  });

  document.querySelector(".day-summary").addEventListener("click", function(e){
    if (e.target.id === "backToTodayBtn") return;
    openDetail("day");
  });

  /* ---------------- Cards: budget / spend / fixed / invest ---------------- */
  function monthTx(){
    var ref = new Date();
    return state.transactions.filter(function(t){ return sameMonth(t.date, ref); });
  }

  function renderCards(){
    var txs = monthTx();
    var total = txs.reduce(function(s,t){ return s + t.amount; }, 0);

    // budget
    var chip = document.getElementById("budgetChip");
    if (state.budgetLimit > 0){
      var pct = Math.round((total / state.budgetLimit) * 100);
      chip.textContent = "已使用 " + pct + "%";
      chip.className = "chip chip-used";
    } else {
      chip.textContent = "尚未設定";
      chip.className = "chip";
    }

    // spend
    document.getElementById("spendMonthLabel").textContent =
      new Date().toLocaleDateString("en-US", { month: "short" });
    document.getElementById("spendValue").textContent = money(total);

    // fixed (proxy: 居住 category share of month total)
    var fixedTotal = txs.filter(function(t){ return t.category === "居住"; })
                         .reduce(function(s,t){ return s + t.amount; }, 0);
    var fixedPct = total > 0 ? Math.round((fixedTotal/total)*100) : 0;
    document.getElementById("fixedValue").textContent = fixedPct + "%";

    // invest
    var inv = state.invest;
    var gain = (inv.price - inv.avgCost) * inv.shares;
    var gainPct = inv.avgCost > 0 ? ((inv.price - inv.avgCost)/inv.avgCost*100) : 0;
    var investEl = document.getElementById("investValue");
    investEl.textContent = (gain >= 0 ? "+" : "") + money(gain) + " (" + gainPct.toFixed(1) + "%)";
    investEl.className = "info-card-value " + (gain >= 0 ? "gain" : "loss");
  }

  function renderGoal(){
    var g = state.goal;
    document.getElementById("goalTitle").textContent = g.name;
    var now = new Date();
    var lastDay = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    var daysLeft = lastDay - now.getDate();
    document.getElementById("goalSub").textContent = "距離月底還有 " + daysLeft + " 天";
    document.getElementById("goalCurrent").textContent = money(g.current) + " / " + money(g.target);
    var pct = g.target > 0 ? Math.min(999, Math.round((g.current/g.target)*100)) : 0;
    document.getElementById("goalPercent").textContent = pct + "%";
    document.getElementById("goalFill").style.width = Math.min(100, pct) + "%";
    var timePct = (now.getDate() / lastDay) * 100;
    document.getElementById("goalMarker").style.left = timePct + "%";
  }

  function renderAsset(){
    document.getElementById("assetValue").textContent =
      Math.round(state.netWorth).toLocaleString("en-US");
    var change = state.netWorthLastMonth > 0
      ? ((state.netWorth - state.netWorthLastMonth)/state.netWorthLastMonth*100)
      : 0;
    var badge = document.getElementById("assetChangeBadge");
    badge.textContent = (change>=0?"+":"") + change.toFixed(1) + "%";
    badge.className = "badge" + (change < 0 ? " neg" : "");
  }

  function renderAll(){
    renderAsset();
    renderGoal();
    renderCards();
    renderDaySummary();
  }

  /* ---------------- Add expense overlay ---------------- */
  var addOverlay = document.getElementById("addOverlay");
  var categoryBtn = document.getElementById("categoryBtn");
  var categoryMenu = document.getElementById("categoryMenu");
  var amountInput = document.getElementById("amountInput");
  var confirmAddBtn = document.getElementById("confirmAddBtn");

  function buildCategoryMenu(){
    CATEGORIES.forEach(function(cat){
      var b = document.createElement("button");
      b.textContent = cat;
      b.addEventListener("click", function(){
        state.pendingCategory = cat;
        categoryBtn.firstChild.textContent = cat + " ";
        categoryMenu.hidden = true;
        Array.prototype.forEach.call(categoryMenu.children, function(c){
          c.classList.toggle("active", c === b);
        });
      });
      categoryMenu.appendChild(b);
    });
  }

  categoryBtn.addEventListener("click", function(){
    categoryMenu.hidden = !categoryMenu.hidden;
  });

  amountInput.addEventListener("input", function(){
    confirmAddBtn.disabled = !(parseFloat(amountInput.value) > 0);
  });

  document.getElementById("openAddBtn").addEventListener("click", function(){
    state.pendingCategory = CATEGORIES[0];
    categoryBtn.firstChild.textContent = CATEGORIES[0] + " ";
    amountInput.value = "";
    confirmAddBtn.disabled = true;
    categoryMenu.hidden = true;
    addOverlay.hidden = false;
    setTimeout(function(){ amountInput.focus(); }, 50);
  });

  confirmAddBtn.addEventListener("click", function(){
    var amt = parseFloat(amountInput.value);
    if (!(amt > 0)) return;
    state.transactions.push({
      id: cryptoId(),
      date: state.selectedDate,
      category: state.pendingCategory,
      amount: amt
    });
    addOverlay.hidden = true;
    renderAll();
  });

  /* ---------------- Generic overlay close ---------------- */
  document.querySelectorAll(".backdrop").forEach(function(bd){
    bd.addEventListener("click", function(){
      addOverlay.hidden = true;
      document.getElementById("detailOverlay").hidden = true;
    });
  });

  /* ---------------- Detail overlay ---------------- */
  var detailOverlay = document.getElementById("detailOverlay");
  var detailSheet = document.getElementById("detailSheet");

  function txRow(t){
    var d = parseKey(t.date);
    return '<div class="tx-row">' +
      '<div class="tx-left"><span class="tx-cat">' + t.category + '</span>' +
      '<span class="tx-date">' + (d.getMonth()+1) + '/' + pad(d.getDate()) + '</span></div>' +
      '<span class="tx-amt">' + money(t.amount) + '</span></div>';
  }

  function openDetail(kind){
    var html = "";
    if (kind === "day"){
      var isToday = state.selectedDate === todayKey;
      var d = parseKey(state.selectedDate);
      var label = isToday ? "今天" : ((d.getMonth()+1) + "月" + d.getDate() + "日");
      var txs = state.transactions.filter(function(t){ return t.date === state.selectedDate; });
      html = detailHead(label + " 的紀錄", txs.length + " 筆消費");
      html += txs.length ? txs.map(txRow).join("") : emptyState("這天還沒有記帳紀錄");
    }
    else if (kind === "budget"){
      var txs2 = monthTx();
      var total = txs2.reduce(function(s,t){ return s+t.amount; }, 0);
      html = detailHead("本月預算", "已使用 " + money(total) + " / " + money(state.budgetLimit));
      html += '<div class="progress-track" style="margin-bottom:18px;"><div class="progress-fill" style="width:' +
        Math.min(100, state.budgetLimit>0 ? (total/state.budgetLimit*100) : 0) + '%"></div></div>';
      var byCat = {};
      txs2.forEach(function(t){ byCat[t.category] = (byCat[t.category]||0) + t.amount; });
      var cats = Object.keys(byCat);
      html += cats.length ? cats.sort(function(a,b){return byCat[b]-byCat[a];}).map(function(c){
        return '<div class="tx-row"><span class="tx-cat">' + c + '</span><span class="tx-amt">' + money(byCat[c]) + '</span></div>';
      }).join("") : emptyState("這個月還沒有分類支出");
      html += '<div class="field-row"><label>本月預算上限</label><input type="number" id="budgetInput" value="' + state.budgetLimit + '" /></div>';
      html += '<div class="save-row"><button id="budgetSaveBtn">儲存預算</button></div>';
    }
    else if (kind === "spend"){
      var txs3 = monthTx().slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
      var total3 = txs3.reduce(function(s,t){ return s+t.amount; }, 0);
      html = detailHead("本月花費明細", money(total3) + " ・ " + txs3.length + " 筆");
      html += txs3.length ? txs3.map(txRow).join("") : emptyState("這個月還沒有記帳紀錄");
    }
    else if (kind === "fixed"){
      var txs4 = monthTx().filter(function(t){ return t.category === "居住"; });
      var total4 = txs4.reduce(function(s,t){ return s+t.amount; }, 0);
      html = detailHead("固定花費", "目前以「居住」分類估算 ・ " + money(total4));
      html += txs4.length ? txs4.map(txRow).join("") : emptyState("這個月還沒有居住類固定支出");
    }
    else if (kind === "invest"){
      var inv = state.invest;
      var gain = (inv.price - inv.avgCost) * inv.shares;
      var gainPct = inv.avgCost>0 ? ((inv.price-inv.avgCost)/inv.avgCost*100) : 0;
      html = detailHead(inv.symbol + " 投資明細", (gain>=0?"+":"") + money(gain) + " (" + gainPct.toFixed(1) + "%)");
      html += sparklineSVG();
      html += '<div class="field-row"><label>持有股數</label><input type="number" id="investShares" value="' + inv.shares + '" /></div>';
      html += '<div class="field-row"><label>平均成本</label><input type="number" id="investCost" value="' + inv.avgCost + '" /></div>';
      html += '<div class="field-row"><label>目前市價（手動更新）</label><input type="number" id="investPrice" value="' + inv.price + '" /></div>';
      html += '<div class="save-row"><button id="investSaveBtn">儲存</button></div>';
    }
    detailSheet.innerHTML = html;
    detailOverlay.hidden = false;
    wireDetailInputs(kind);
  }

  function detailHead(title, sub){
    return '<div class="detail-head"><h3>' + title + '</h3>' +
      '<button class="detail-close" data-close="detail">×</button></div>' +
      '<p class="detail-sub">' + sub + '</p>';
  }
  function emptyState(msg){ return '<div class="empty-state">' + msg + '</div>'; }
  function sparklineSVG(){
    return '<div class="sparkline-wrap"><svg viewBox="0 0 300 80" width="100%" height="80" fill="none">' +
      '<path d="M0 55 C20 60 35 40 55 44 S90 30 110 34 S150 15 175 18 S220 8 245 12 S280 18 300 10" ' +
      'stroke="#3d8bff" stroke-width="3" stroke-linecap="round"/></svg></div>';
  }

  function wireDetailInputs(kind){
    document.querySelectorAll('[data-close="detail"]').forEach(function(b){
      b.addEventListener("click", function(){ detailOverlay.hidden = true; });
    });
    if (kind === "budget"){
      var btn = document.getElementById("budgetSaveBtn");
      if (btn) btn.addEventListener("click", function(){
        var v = parseFloat(document.getElementById("budgetInput").value);
        if (v >= 0) state.budgetLimit = v;
        detailOverlay.hidden = true;
        renderAll();
      });
    }
    if (kind === "invest"){
      var btn2 = document.getElementById("investSaveBtn");
      if (btn2) btn2.addEventListener("click", function(){
        var sh = parseFloat(document.getElementById("investShares").value);
        var co = parseFloat(document.getElementById("investCost").value);
        var pr = parseFloat(document.getElementById("investPrice").value);
        if (sh>=0) state.invest.shares = sh;
        if (co>=0) state.invest.avgCost = co;
        if (pr>=0) state.invest.price = pr;
        detailOverlay.hidden = true;
        renderAll();
      });
    }
  }

  /* While the panel is collapsed, tapping a card opens the panel rather than
     jumping straight into a detail sheet the user can barely see. */
  function bindCard(id, kind){
    document.getElementById(id).addEventListener("click", function(){
      if (typeof sheetState !== "undefined" && sheetState === "peek"){
        goTo("full", true);
        return;
      }
      openDetail(kind);
    });
  }
  bindCard("cardBudget", "budget");
  bindCard("cardSpend", "spend");
  bindCard("cardFixed", "fixed");
  bindCard("cardInvest", "invest");

  /* ---------------- Net worth quick edit ---------------- */
  document.getElementById("assetAmount").addEventListener("click", function(){
    var v = prompt("輸入目前淨資產金額", Math.round(state.netWorth));
    if (v === null) return;
    var n = parseFloat(v);
    if (!isNaN(n) && n >= 0){
      state.netWorth = n;
      renderAll();
    }
  });

  /* ---------------- Goal edit ---------------- */
  var goalEdit = document.getElementById("goalEdit");
  document.getElementById("editGoalBtn").addEventListener("click", function(){
    document.getElementById("goalNameInput").value = state.goal.name;
    document.getElementById("goalTargetInput").value = state.goal.target;
    document.getElementById("goalCurrentInput").value = state.goal.current;
    goalEdit.classList.add("open");
  });
  document.getElementById("goalCancelBtn").addEventListener("click", function(){
    goalEdit.classList.remove("open");
  });
  document.getElementById("goalSaveBtn").addEventListener("click", function(){
    var name = document.getElementById("goalNameInput").value.trim();
    var target = parseFloat(document.getElementById("goalTargetInput").value);
    var current = parseFloat(document.getElementById("goalCurrentInput").value);
    if (name) state.goal.name = name;
    if (target >= 0) state.goal.target = target;
    if (current >= 0) state.goal.current = current;
    goalEdit.classList.remove("open");
    renderAll();
  });

  /* ---------------- Draggable bottom sheet ---------------- */
  var sheet = document.getElementById("sheet");
  var handle = document.getElementById("sheetHandle");
  var goalCardEl = document.querySelector(".goal-card");
  var sheetState = "peek"; // 'peek' | 'full'
  var dragStartY = 0, dragStartTranslate = 0, dragging = false;
  var peekOffset = 0, fullOffset = 0;

  function computeOffsets(){
    var phone = document.querySelector(".phone");
    var art = document.getElementById("seasonArt");
    var phoneH = phone.clientHeight;

    // Expanded position: sheet top rises to the top of the trunk artwork
    var fullTop = art.offsetTop;
    // Peek position: sheet top sits just below the trunk, matching the design gap
    var peekTop = art.offsetTop + art.offsetHeight + 16;

    // Sheet is tall enough to reach the bottom of the screen when expanded
    sheet.style.top = fullTop + "px";
    sheet.style.height = (phoneH - fullTop) + "px";

    fullOffset = 0;
    peekOffset = Math.max(0, peekTop - fullTop);
  }

  function setSheetY(y, animate){
    sheet.style.transition = animate ? "transform .28s cubic-bezier(.22,.9,.35,1)" : "none";
    sheet.style.transform = "translateY(" + y + "px)";
  }

  function goTo(stateName, animate){
    sheetState = stateName;
    setSheetY(stateName === "peek" ? peekOffset : fullOffset, animate !== false);
  }

  var dragStartTime = 0;
  var suppressSheetClickUntil = 0;

  handle.addEventListener("pointerdown", function(e){
    dragging = true;
    dragStartY = e.clientY;
    dragStartTime = Date.now();
    var current = sheetState === "peek" ? peekOffset : fullOffset;
    dragStartTranslate = current;
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener("pointermove", function(e){
    if (!dragging) return;
    var delta = e.clientY - dragStartY;
    var y = Math.min(peekOffset, Math.max(fullOffset, dragStartTranslate + delta));
    setSheetY(y, false);
  });
  function endDrag(e){
    if (!dragging) return;
    dragging = false;
    var moved = Math.abs(e.clientY - dragStartY);
    var elapsed = Date.now() - dragStartTime;

    // A quick tap with almost no movement toggles the panel instead of dragging it
    if (moved < 6 && elapsed < 350){
      suppressSheetClickUntil = Date.now() + 400;
      goTo(sheetState === "peek" ? "full" : "peek", true);
      return;
    }

    var current = dragStartTranslate + (e.clientY - dragStartY);
    var mid = (peekOffset + fullOffset) / 2;
    goTo(current < mid ? "full" : "peek", true);
  }
  handle.addEventListener("pointerup", endDrag);
  handle.addEventListener("pointercancel", endDrag);

  // Tapping anywhere on the collapsed panel (except a control) opens it
  sheet.addEventListener("click", function(e){
    if (sheetState !== "peek") return;
    if (Date.now() < suppressSheetClickUntil) return;
    if (e.target.closest("button, input, select, textarea, a")) return;
    goTo("full", true);
  });

  window.addEventListener("resize", function(){
    measureDateItems();
    updateCenterDate();
    computeOffsets();
    goTo(sheetState, false);
  });

  /* ---------------- Scroll indicator ---------------- */
  var sheetContentEl = document.getElementById("sheetContent");
  var scrollIndicator = document.getElementById("scrollIndicator");
  var indicatorHideTimer = null;

  function updateScrollIndicator(){
    var viewH = sheetContentEl.clientHeight;
    var contentH = sheetContentEl.scrollHeight;
    if (contentH <= viewH + 2){
      scrollIndicator.classList.remove("is-active");
      return;
    }
    var trackTop = sheetContentEl.offsetTop + 46;
    var trackH = viewH - 56;
    var thumbH = Math.max(28, trackH * (viewH / contentH));
    var maxScroll = contentH - viewH;
    var ratio = maxScroll > 0 ? (sheetContentEl.scrollTop / maxScroll) : 0;
    var thumbTop = trackTop + (trackH - thumbH) * ratio;

    scrollIndicator.style.top = thumbTop + "px";
    scrollIndicator.style.height = thumbH + "px";
    scrollIndicator.classList.add("is-active");

    clearTimeout(indicatorHideTimer);
    indicatorHideTimer = setTimeout(function(){
      scrollIndicator.classList.remove("is-active");
    }, 700);
  }

  sheetContentEl.addEventListener("scroll", function(){
    requestAnimationFrame(updateScrollIndicator);
  }, { passive: true });

  /* ---------------- Init ---------------- */
  applySeason();
  buildDateStrip();
  buildCategoryMenu();
  renderAll();

  requestAnimationFrame(function(){
    measureDateItems();
    measureBackBtn();
    scrollToKey(todayKey, false);
    updateCenterDate();
    computeOffsets();
    goTo("peek", false);
  });

  window.addEventListener("load", function(){
    measureDateItems();
    updateCenterDate();
    computeOffsets();
    goTo(sheetState, false);
  });

})();
</script>
</body>
</html>
